name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 纯函数/单元测试：不启动 Spring、不需要数据库
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests and package
        run: mvn -B -ntp package

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v7
        with:
          name: application-jars
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  # 集成测试：failsafe 运行 *IT，Testcontainers 使用 runner 自带的 Docker 起 MySQL 8.0
  # pull_request 必跑；没装 Docker 的本地机器用 -Dit.db.mode=external 连本机 MySQL
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run integration tests with Testcontainers MySQL
        run: mvn -B -ntp verify -DskipUnitTests=true

      - name: Upload integration test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            target/failsafe-reports
            target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  # 浏览器 E2E：MySQL 用 service 容器，应用用 jar 由 Playwright 拉起
  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: assoc_e2e
          MYSQL_USER: assoc
          MYSQL_PASSWORD: assoc_e2e_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_URL: "jdbc:mysql://127.0.0.1:3306/assoc_e2e?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: assoc
      DB_PASSWORD: assoc_e2e_pw
      ADMIN_USERNAME: Yorkchain
      ADMIN_PASSWORD: "E2e-Bootstrap-Admin-2026!"
      E2E_ADMIN_PASSWORD: "E2e-Bootstrap-Admin-2026!"
      DEMO_DATA_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build application jar
        run: mvn -B -ntp -Dmaven.test.skip=true package

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
