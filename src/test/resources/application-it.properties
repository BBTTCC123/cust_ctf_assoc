# 集成测试（*IT）专用配置。
# 数据源由 TestDatabase 提供：默认起 Testcontainers MySQL；
# 本机没有 Docker 时只要传入 it.datasource.url 就会改用外部 MySQL：
#   mvn verify -DskipUnitTests=true \
#     -Dit.datasource.url="jdbc:mysql://127.0.0.1:3309/assoc_it?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false" \
#     -Dit.datasource.username=assoc -Dit.datasource.password=assoc_it_pw

# 上传文件写到 target 下，测试结束可随 clean 一起删掉
app.storage.root=target/test-it-storage

# 生产/CI 都不加载演示数据；用例自己造数
app.demo-data.enabled=false

spring.jpa.hibernate.ddl-auto=validate

logging.level.cn.edu.cust.assoc=INFO
logging.level.org.testcontainers=INFO
logging.level.org.flywaydb=INFO
