<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('我的收藏')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <section th:replace="~{fragments/layout :: pageHero('MEMBER · READING LIST','我的收藏','把想反复读的文章收在这里。')}"></section>
    <div class="container">
        <div class="row-between" style="margin-bottom:16px;">
            <p class="lead" style="margin:0;">共 <strong th:text="${#lists.size(favorites)}">0</strong> 篇</p>
            <a class="btn ghost" th:href="@{/articles}">去技术空间</a>
        </div>
        <p th:if="${#lists.isEmpty(favorites)}" class="lead">还没有收藏文章。</p>
        <div class="grid-2" th:unless="${#lists.isEmpty(favorites)}">
            <article class="card" th:each="f : ${favorites}" style="display:flex;justify-content:space-between;gap:14px;align-items:center;">
                <div>
                    <h2 style="font-size:1rem;"><a th:href="@{/articles/{id}(id=${f.id()})}" th:text="${f.title()}">标题</a></h2>
                    <p class="hint" style="margin-top:4px;">收藏的文章</p>
                </div>
                <span class="tag" th:text="${f.visibility() == 'PUBLIC' ? '公开' : '站内'}">站内</span>
            </article>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
