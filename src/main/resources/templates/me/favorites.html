<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('我的收藏')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <div class="row-between">
        <h1>我的收藏</h1>
        <a class="btn ghost" th:href="@{/me/articles}">我的文章</a>
    </div>
    <p th:if="${#lists.isEmpty(favorites)}" class="lead">还没有收藏文章。</p>
    <ul class="article-list" th:unless="${#lists.isEmpty(favorites)}">
        <li th:each="f : ${favorites}">
            <a th:href="@{/articles/{id}(id=${f.id()})}" th:text="${f.title()}">标题</a>
            <span class="tag" th:text="${f.visibility() == 'PUBLIC' ? '公开' : '站内'}">站内</span>
        </li>
    </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
