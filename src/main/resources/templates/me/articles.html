<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('我的文章')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <section th:replace="~{fragments/layout :: pageHero('MEMBER · WRITING','我的文章','草稿只有你自己能看到；提交后由内容管理员审核，驳回原因会显示在列表里。')}"></section>
    <div class="container">
        <div class="row-between" style="margin-bottom:16px;">
            <p class="lead" style="margin:0;">共 <strong th:text="${#lists.size(articles)}">0</strong> 篇文章</p>
            <a class="btn" th:href="@{/me/articles/new}">写一篇</a>
        </div>
        <p th:if="${message}" class="ok" th:text="${message}"></p>
        <p th:if="${errorMessage}" class="err" th:text="${errorMessage}"></p>
        <p th:if="${#lists.isEmpty(articles)}" class="lead">还没有文章，写一篇试试。</p>
        <div class="panel" th:unless="${#lists.isEmpty(articles)}" style="padding:0;overflow:hidden;">
            <table class="table" style="border:0;">
                <thead><tr><th>标题</th><th>状态</th><th>可见性</th><th>驳回原因</th><th>更新时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="a : ${articles}">
                    <td th:text="${a.title()}">标题</td>
                    <td>
                        <span class="tag" th:if="${a.state() == 'DRAFT'}">草稿</span>
                        <span class="tag warn" th:if="${a.state() == 'PENDING'}">待审核</span>
                        <span class="tag ok" th:if="${a.state() == 'PUBLISHED'}">已发布</span>
                        <span class="tag danger" th:if="${a.state() == 'REJECTED'}">已驳回</span>
                        <span class="tag" th:if="${a.state() == 'OFFLINE'}">已下架</span>
                    </td>
                    <td th:text="${a.visibility() == 'PUBLIC' ? '公开' : '站内'}">站内</td>
                    <td th:text="${a.rejectReason() != null ? a.rejectReason() : '—'}">—</td>
                    <td th:text="${a.updatedAt()}">时间</td>
                    <td class="actions">
                        <a th:if="${a.state() == 'DRAFT' or a.state() == 'REJECTED'}"
                           th:href="@{/me/articles/{id}/edit(id=${a.id()})}">编辑</a>
                        <form th:if="${a.state() == 'DRAFT' or a.state() == 'REJECTED'}"
                              th:action="@{/me/articles/{id}/submit(id=${a.id()})}" method="post" class="inline-form">
                            <button type="submit" class="link-btn">提交审核</button>
                        </form>
                        <a th:if="${a.state() == 'PUBLISHED'}"
                           th:href="@{/articles/{id}(id=${a.id()})}">查看</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
