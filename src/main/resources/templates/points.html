<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('积分榜')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <h1>积分榜</h1>
    <nav class="tabs">
        <a th:href="@{/points(type='ALL')}" th:classappend="${type=='ALL'} ? 'active'">总榜</a>
        <a th:href="@{/points(type='YEAR')}" th:classappend="${type=='YEAR'} ? 'active'">年榜</a>
        <a th:href="@{/points(type='QUARTER')}" th:classappend="${type=='QUARTER'} ? 'active'">季度榜</a>
        <a th:href="@{/points(type='MONTH')}" th:classappend="${type=='MONTH'} ? 'active'">月榜</a>
    </nav>
    <p th:if="${#lists.isEmpty(rows)}" class="lead">还没有积分记录。</p>
    <table class="table" th:unless="${#lists.isEmpty(rows)}">
        <thead><tr><th>#</th><th>成员</th><th>积分</th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.rank}">1</td>
            <td><a th:href="@{/members/{id}(id=${r.userId})}" th:text="${r.nickname}">昵称</a></td>
            <td th:text="${r.total}">0</td>
        </tr>
        </tbody>
    </table>
    <p class="hint">点击成员昵称可以查看积分构成；内部佐证不对外公开。</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
