<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('请求无法完成')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="error-page">
    <p class="error-code">REQUEST / BLOCKED</p>
    <h1>请求无法完成。</h1>
    <p th:text="${message}">原因</p>
    <p class="hint" th:if="${requestId}" th:text="'错误编号：' + ${requestId}">错误编号</p>
    <p style="margin-top:18px;"><a class="btn" th:href="@{/}">回首页</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
