<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>请求无法完成</title>
    <style>body{font-family:system-ui;text-align:center;padding:80px 20px;color:#1f2933}
    .msg{color:#b91c1c;font-size:1.1rem}.id{color:#616e7c;font-size:.85rem}</style>
</head>
<body>
<h1>请求无法完成</h1>
<p class="msg" th:text="${message}">原因</p>

<p class="id" th:if="${requestId}" th:text="'错误编号：' + ${requestId}">错误编号</p>
</body>
</html>
