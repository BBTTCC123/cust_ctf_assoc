<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('服务异常')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="error-page">
    <p class="error-code">500 / SERVER ERROR</p>
    <h1>服务出了点问题。</h1>
    <p>已经记录下来了。请稍后重试，或回首页继续浏览。</p>
    <p class="hint" th:if="${requestId}" th:text="'错误编号：' + ${requestId}">错误编号</p>
    <p style="margin-top:18px;"><a class="btn" th:href="@{/}">回首页</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
