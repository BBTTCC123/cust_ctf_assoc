<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('竞赛档案')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <section th:replace="~{fragments/layout :: pageHero('CUST · COMPETITION ARCHIVE','竞赛档案','协会打过的每一场比赛，都记在这里。点进详情能看参赛成员、奖项和现场照片。')}"></section>
    <div class="container">
        <form method="get" th:action="@{/competitions}" class="search-bar">
            <select name="season" aria-label="选择赛季">
                <option value="">全部赛季</option>
                <option th:each="y : ${seasons}" th:value="${y}" th:text="${y} + ' 赛季'"
                        th:selected="${season != null and y == season}">2025 赛季</option>
            </select>
            <button type="submit" class="btn">筛选赛季</button>
            <a th:if="${season != null}" th:href="@{/competitions}" class="link-btn">清空筛选</a>
        </form>

        <p th:if="${#lists.isEmpty(competitions)}" class="lead">还没有公开的记录。</p>
        <div class="comp-grid" th:unless="${#lists.isEmpty(competitions)}">
            <article class="card comp-card" th:each="c : ${competitions}">
                <div class="comp-top">
                    <span class="tag" th:text="${c.levelLabel()}">级别</span>
                    <span class="comp-date" th:text="${c.seasonYear()} + ' 赛季'">2026 赛季</span>
                </div>
                <h2><a th:href="@{/competitions/{id}(id=${c.id()})}" th:text="${c.name()}">比赛名称</a></h2>
                <div class="comp-meta">
                    <span class="tag" th:text="${c.categoryLabel()}">类别</span>
                    <span class="comp-date"
                          th:text="${#temporals.format(c.startDate(),'yyyy-MM-dd')} + ' — ' + ${#temporals.format(c.endDate(),'yyyy-MM-dd')}">日期</span>
                </div>
                <p class="comp-date" th:text="${c.organizer()}">主办方</p>
                <span class="arrow">查看档案 →</span>
            </article>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
