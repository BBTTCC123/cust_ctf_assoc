<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('注册')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="auth-page">
    <section class="auth-visual">
        <div>
            <img class="brand-logo" th:src="@{/images/logo.webp}" alt="CUST 网络攻防协会会徽">
            <p class="eyebrow" style="color:#8fd4ff;">INVITE ONLY</p>
            <h1>用一张邀请码，<br>加入协会档案。</h1>
            <p class="lead">账号只能通过协会发放的邀请码注册。注册后即可查看站内文章、积分与战队空间。</p>
            <ul class="auth-points">
                <li>邀请码由超管发放，一次性使用</li>
                <li>密码至少 12 位，含三类字符</li>
                <li>注册后请完善个人资料与隐私开关</li>
            </ul>
        </div>
        <p class="hint" style="color:#a8c6e2;">CUST · NETWORK ATTACK &amp; DEFENSE ASSOCIATION</p>
    </section>
    <div class="panel auth-card">
        <p class="eyebrow">CREATE ACCOUNT</p>
        <h2>邀请码注册</h2>
        <p class="lead">填写邀请码与账号信息。</p>
        <p th:if="${message}" class="ok" th:text="${message}"></p>
        <p th:if="${errorMessage}" class="err" th:text="${errorMessage}"></p>
        <form th:action="@{/register}" method="post" class="form-grid single">
            <label>邀请码<input type="text" name="inviteCode" th:value="${code}" required autocomplete="off" placeholder="CUST-XXXX"></label>
            <label>登录名（字母/数字/下划线，4-32 位）
                <input type="text" name="username" required pattern="[A-Za-z0-9_]{4,32}" autocomplete="username" placeholder="登录名">
            </label>
            <label>昵称<input type="text" name="nickname" required maxlength="64" placeholder="站内展示的昵称"></label>
            <label>密码（至少 12 位，含大小写/数字/符号中的三类）
                <input type="password" name="password" required minlength="12" autocomplete="new-password" placeholder="设置密码">
            </label>
            <label>确认密码
                <input type="password" name="confirmPassword" required minlength="12" autocomplete="new-password" placeholder="再次输入密码">
            </label>
            <div class="form-actions"><button type="submit" class="btn">注册账号</button></div>
        </form>
        <p class="hint">已有账号？<a th:href="@{/login}" style="color:var(--blue);font-weight:600;">去登录</a></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
