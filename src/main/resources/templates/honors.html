<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('荣誉')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <section th:replace="~{fragments/layout :: pageHero('CUST · HONOR WALL','荣誉','协会拿过的成绩，都记在这里。每一块牌匾背后，都是一次次熬夜和复盘。')}"></section>
    <div class="container">
        <p th:if="${#lists.isEmpty(items)}" class="lead">还没有记录。</p>
        <div class="honor-wall" th:unless="${#lists.isEmpty(items)}">
            <article class="card honor-card" th:each="h : ${items}">
                <span class="honor-year" th:text="${h.year} + ' · HONOR'">2025 · HONOR</span>
                <h2 th:text="${h.title}">荣誉名称</h2>
                <p th:if="${h.description}" th:text="${h.description}">说明</p>
            </article>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
