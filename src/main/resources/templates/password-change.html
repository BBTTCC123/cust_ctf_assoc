<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="auth-page">
    <section class="auth-visual">
        <div>
            <img class="brand-logo" th:src="@{/images/logo.webp}" alt="CUST 网络攻防协会会徽">
            <p class="eyebrow" style="color:#8fd4ff;">ACCOUNT SECURITY</p>
            <h1>先换一把<br>只有你知道的钥匙。</h1>
            <p class="lead">首次登录或管理员重置后必须先改密，改完会用新密码重新登录。</p>
            <ul class="auth-points">
                <li>至少 12 位，包含大小写、数字、符号中的三类</li>
                <li>不要与其他站点共用密码</li>
                <li>修改后旧会话会立即失效</li>
            </ul>
        </div>
        <p class="hint" style="color:#a8c6e2;">CUST · NETWORK ATTACK &amp; DEFENSE ASSOCIATION</p>
    </section>
    <div class="panel auth-card">
        <p class="eyebrow">PASSWORD</p>
        <h2>修改密码</h2>
        <p class="lead" th:text="'当前账号：' + ${username}">当前账号</p>
        <p th:if="${errorMessage}" class="err" th:text="${errorMessage}"></p>
        <form th:action="@{/password/change}" method="post" class="form-grid single">
            <label>当前密码
                <input type="password" name="currentPassword" required autocomplete="current-password" placeholder="当前密码">
            </label>
            <label>新密码
                <input type="password" name="newPassword" required minlength="12" autocomplete="new-password" placeholder="至少 12 位">
            </label>
            <label>确认新密码
                <input type="password" name="confirmPassword" required minlength="12" autocomplete="new-password" placeholder="再次输入新密码">
            </label>
            <div class="form-actions"><button type="submit" class="btn">保存并重新登录</button></div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
