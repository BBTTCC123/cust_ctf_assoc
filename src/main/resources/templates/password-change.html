<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container" style="max-width: 520px;">
    <h1>修改密码</h1>
    <p class="lead" th:text="'当前账号：' + ${username}">当前账号</p>
    <p class="hint">首次登录或管理员重置后必须先改密。密码至少 12 位，包含大小写、数字、符号中的三类。</p>
    <p th:if="${errorMessage}" class="err" th:text="${errorMessage}"></p>
    <form th:action="@{/password/change}" method="post" class="form-grid single">
        <label>当前密码
            <input type="password" name="currentPassword" required autocomplete="current-password">
        </label>
        <label>新密码
            <input type="password" name="newPassword" required minlength="12" autocomplete="new-password">
        </label>
        <label>确认新密码
            <input type="password" name="confirmPassword" required minlength="12" autocomplete="new-password">
        </label>
        <div class="form-actions"><button type="submit" class="btn">保存并重新登录</button></div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
