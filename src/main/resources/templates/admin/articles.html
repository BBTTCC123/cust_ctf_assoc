<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('文章审核')}"></head>
<body>
<header th:replace="~{admin/layout :: topbar}"></header>
<div class="admin-shell">
    <aside th:replace="~{admin/layout :: sidebar}"></aside>
    <main class="admin-main">
        <div class="row-between">
            <h1>文章审核</h1>
            <span class="actions-inline">
                <a class="btn ghost" th:href="@{/admin/comments}">评论审核</a>
                <a class="btn ghost" th:href="@{/admin/sensitive-words}">敏感词</a>
                <a class="btn" th:href="@{/admin/articles/new}">写一篇</a>
            </span>
        </div>
        <p th:if="${message}" class="ok" th:text="${message}"></p>
        <p th:if="${errorMessage}" class="err" th:text="${errorMessage}"></p>

        <h2>待审（<span th:text="${#lists.size(pending)}">0</span>）</h2>
        <p th:if="${#lists.isEmpty(pending)}" class="lead">没有待审文章。</p>
        <table class="table" th:unless="${#lists.isEmpty(pending)}">
            <thead><tr><th>标题</th><th>作者</th><th>可见性</th><th>涉漏洞点</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="a : ${pending}">
                <td><a th:href="@{/articles/{id}(id=${a.id()})}" target="_blank" th:text="${a.title()}">标题</a></td>
                <td th:text="${a.authorName()}">作者</td>
                <td th:text="${a.visibility() == 'PUBLIC' ? '公开' : '站内'}">站内</td>
                <td th:text="${a.involvesVuln()} ? '是' : '否'">否</td>
                <td class="actions">
                    <form th:action="@{/admin/articles/{id}/publish(id=${a.id()})}" method="post" class="inline-form">
                        <button type="submit" class="link-btn">发布</button>
                    </form>
                    <form th:action="@{/admin/articles/{id}/reject(id=${a.id()})}" method="post" class="inline-form">
                        <input type="text" name="reason" placeholder="驳回原因" maxlength="500">
                        <button type="submit" class="link-btn danger">驳回</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <h2>已发布（<span th:text="${#lists.size(published)}">0</span>）</h2>
        <p th:if="${#lists.isEmpty(published)}" class="lead">还没有已发布文章。</p>
        <table class="table" th:unless="${#lists.isEmpty(published)}">
            <thead><tr><th>标题</th><th>作者</th><th>可见性</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="a : ${published}">
                <td><a th:href="@{/articles/{id}(id=${a.id()})}" target="_blank" th:text="${a.title()}">标题</a></td>
                <td th:text="${a.authorName()}">作者</td>
                <td th:text="${a.visibility() == 'PUBLIC' ? '公开' : '站内'}">站内</td>
                <td class="actions">
                    <form th:action="@{/admin/articles/{id}/offline(id=${a.id()})}" method="post" class="inline-form"
                          data-confirm="下架后前台立即不可见，确定？">
                        <input type="text" name="reason" placeholder="下架原因" maxlength="500">
                        <button type="submit" class="link-btn danger">下架</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
