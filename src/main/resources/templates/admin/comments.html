<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('评论审核')}"></head>
<body>
<header th:replace="~{admin/layout :: topbar}"></header>
<div class="admin-shell">
    <aside th:replace="~{admin/layout :: sidebar}"></aside>
    <main class="admin-main">
        <h1>评论审核</h1>
        <p class="lead">所有评论先审后发；敏感词命中的评论在提交时就会处理。</p>
        <p th:if="${message}" class="ok" th:text="${message}"></p>
        <p th:if="${errorMessage}" class="err" th:text="${errorMessage}"></p>
        <p th:if="${#lists.isEmpty(comments)}" class="lead">没有待审评论。</p>
        <table class="table" th:unless="${#lists.isEmpty(comments)}">
            <thead><tr><th>文章</th><th>评论人</th><th>内容</th><th>时间</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${comments}">
                <td><a th:href="@{/articles/{id}(id=${c.articleId()})}" target="_blank" th:text="${c.articleTitle()}">文章</a></td>
                <td th:text="${c.nickname()}">成员</td>
                <td th:text="${c.content()}">内容</td>
                <td th:text="${#temporals.format(c.createdAt(),'yyyy-MM-dd HH:mm')}">时间</td>
                <td class="actions">
                    <form th:action="@{/admin/comments/{id}/approve(id=${c.id()})}" method="post" class="inline-form">
                        <button type="submit" class="link-btn">通过</button>
                    </form>
                    <form th:action="@{/admin/comments/{id}/reject(id=${c.id()})}" method="post" class="inline-form">
                        <button type="submit" class="link-btn danger">驳回</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
