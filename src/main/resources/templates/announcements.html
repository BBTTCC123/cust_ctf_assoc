<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('公告')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <section th:replace="~{fragments/layout :: pageHero('CUST · NOTICE BOARD','公告','协会的通知、活动与重要安排，都放在这里。')}"></section>
    <div class="container">
        <div class="panel">
            <p th:if="${#lists.isEmpty(items)}" class="lead">还没有公告。</p>
            <div class="timeline" th:unless="${#lists.isEmpty(items)}">
                <div class="timeline-item" th:each="a : ${items}">
                    <span class="timeline-date" th:text="${#temporals.format(a.publishedAt,'yyyy-MM-dd')}">2026-10-28</span>
                    <article class="card timeline-card">
                        <div class="row-between">
                            <h2><a th:href="@{/announcements/{id}(id=${a.id})}" th:text="${a.title}">标题</a></h2>
                            <span class="tag warn" th:if="${a.pinned}">置顶</span>
                        </div>
                        <p>点击查看公告全文</p>
                    </article>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
