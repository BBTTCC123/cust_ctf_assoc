<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · 网络攻防协会'">网络攻防协会</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav" class="site-header">
    <a class="brand" th:href="@{/}">网络攻防协会</a>
    <nav>
        <a th:href="@{/}">首页</a>
        <a th:href="@{/competitions}">竞赛档案</a>
        <a th:href="@{/points}">积分榜</a>
        <a th:href="@{/articles}">技术空间</a>
        <a th:href="@{/honors}">荣誉</a>
        <a th:href="@{/announcements}">公告</a>
        <a th:href="@{/join}">加入我们</a>
        <a th:href="@{/about}">关于</a>
        <a sec:authorize="hasAnyRole('SUPER_ADMIN','CONTENT_ADMIN','POINTS_ADMIN','PR_ADMIN')"
           th:href="@{/admin}">后台</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/me}">我的积分</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">登录</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline-form">
            <span class="who" th:text="${#authentication.name}">用户</span>
            <button type="submit" class="link-btn">退出</button>
        </form>
    </nav>
</header>
<footer th:fragment="footer" class="site-footer">
    <p>© 2026 网络攻防协会 · 仅供学习交流，禁止用于未授权测试</p>
</footer>
</body>
</html>
