<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container" style="max-width: 420px;">
    <h1>登录</h1>
    <p class="lead">站内文章、积分明细、内部资料需要登录后才能看。</p>
    <p th:if="${message}" class="ok" th:text="${message}"></p>
    <p th:if="${param.error != null and param.error[0] != 'too_many'}" class="err">账号或密码不对</p>
    <p th:if="${param.error != null and param.error[0] == 'too_many'}" class="err">
        登录失败次数过多，请 15 分钟后再试
    </p>
    <p th:if="${param.logout}" class="ok">已经退出登录</p>
    <form method="post" th:action="@{/login}" class="login-form">
        <label>账号
            <input type="text" name="username" required autofocus autocomplete="username">
        </label>
        <label>密码
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit">登录</button>
    </form>
    <p class="hint">有邀请码？<a th:href="@{/register}">注册新账号</a></p>
    <p class="hint">忘记密码请联系超管重置，重置后首次登录必须改密。</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
