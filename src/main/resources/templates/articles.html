<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('技术空间')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <h1>技术空间</h1>
    <p class="lead" th:if="${loggedIn}">站内可见的文章都在这儿；标了「公开」的游客也能看。</p>
    <p class="lead" th:unless="${loggedIn}">这里只有公开文章。登录后能看到站内的全部内容。</p>

    <form method="get" th:action="@{/articles}" class="search-bar">
        <input type="search" name="q" th:value="${q}" placeholder="搜索标题、摘要或正文" maxlength="100">
        <select name="tag">
            <option value="">全部标签</option>
            <option th:each="t : ${tags}" th:value="${t}" th:text="${t}" th:selected="${t == tag}">标签</option>
        </select>
        <button type="submit" class="btn">筛选</button>
        <a th:if="${q != null or tag != null}" th:href="@{/articles}" class="hint">清空</a>
    </form>

    <p th:if="${#lists.isEmpty(articles.content)}" class="lead">没有找到文章。</p>
    <div class="article-grid">
        <article class="card" th:each="a : ${articles.content}">
            <a th:if="${a.coverMediaId() != null}" th:href="@{/articles/{id}(id=${a.id()})}">
                <img class="cover" th:src="@{/media/{id}(id=${a.coverMediaId()})}" th:alt="${a.title()}">
            </a>
            <h2><a th:href="@{/articles/{id}(id=${a.id()})}" th:text="${a.title()}">标题</a></h2>
            <p class="muted" th:text="${a.authorName()} + ' · ' + ${#temporals.format(a.publishedAt(),'yyyy-MM-dd')}">作者 · 日期</p>
            <p th:if="${a.summary()}" th:text="${a.summary()}">摘要</p>
            <p class="tag-row">
                <span class="tag" th:each="t : ${a.tags()}" th:text="${t}">标签</span>
                <span class="tag" th:text="${a.visibility() == 'PUBLIC'} ? '公开' : '站内'">站内</span>
                <span class="tag warn" th:if="${a.involvesVuln()}">涉漏洞点</span>
            </p>
        </article>
    </div>

    <nav class="pager" th:if="${articles.totalPages > 1}">
        <a th:if="${articles.hasPrevious()}"
           th:href="@{/articles(q=${q},tag=${tag},page=${articles.number - 1})}">上一页</a>
        <span th:text="${articles.number + 1} + ' / ' + ${articles.totalPages}">1 / 1</span>
        <a th:if="${articles.hasNext()}"
           th:href="@{/articles(q=${q},tag=${tag},page=${articles.number + 1})}">下一页</a>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
