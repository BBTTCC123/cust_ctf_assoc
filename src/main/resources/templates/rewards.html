<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('积分兑换')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <section class="page-hero">
        <div class="page-hero-inner">
            <div class="page-hero-copy">
                <p class="eyebrow">MEMBER · REWARDS</p>
                <h1>积分兑换</h1>
                <p class="lead">用积分换协会周边与资源。申请不扣分，管理员审核通过后才扣减余额与库存。</p>
            </div>
            <div class="page-hero-mark" aria-hidden="true"><img th:src="@{/images/logo.webp}" alt=""></div>
        </div>
    </section>
    <div class="container">
        <div class="grid-3" style="margin-bottom:22px;">
            <div class="stat"><b th:text="${view.balance()}">0</b><span>可用积分</span></div>
            <div class="stat"><b th:text="${#lists.size(view.items())}">0</b><span>可兑换资源</span></div>
            <div class="stat"><b th:text="${#lists.size(view.myRequests())}">0</b><span>我的申请</span></div>
        </div>
        <p th:if="${message}" class="ok" th:text="${message}"></p>
        <p th:if="${errorMessage}" class="err" th:text="${errorMessage}"></p>

        <section class="section">
            <div class="section-head"><div><p class="eyebrow">CATALOG</p><h2>可兑换资源</h2></div></div>
            <p th:if="${#lists.isEmpty(view.items())}" class="lead">暂无可兑换资源，等管理员上架。</p>
            <div class="reward-grid" th:unless="${#lists.isEmpty(view.items())}">
                <article class="card reward-card" th:each="item : ${view.items()}">
                    <span class="tag" th:if="${item.stock() > 0}">可兑换</span>
                    <span class="tag danger" th:if="${item.stock() <= 0}">已兑完</span>
                    <h2 th:text="${item.name()}">资源</h2>
                    <p class="hint" th:text="${item.description()} ?: '暂无说明'">说明</p>
                    <p class="reward-cost"><strong th:text="${item.costPoints()}">0</strong> 分 · 剩余 <span th:text="${item.stock()}">0</span> 件</p>
                    <form th:if="${item.stock() > 0 and view.balance() >= item.costPoints()
                                   and !view.pendingItemIds().contains(item.id())}"
                          th:action="@{/rewards/{id}/apply(id=${item.id()})}" method="post" class="reward-form">
                        <input type="text" name="note" maxlength="500" placeholder="备注（可选，如尺码）">
                        <button type="submit" class="btn">申请兑换</button>
                    </form>
                    <p class="hint" th:if="${view.pendingItemIds().contains(item.id())}">已有一条待审核的申请。</p>
                    <p class="hint" th:if="${item.stock() <= 0}">已兑完。</p>
                    <p class="hint" th:if="${item.stock() > 0 and view.balance() < item.costPoints()}">积分不足。</p>
                </article>
            </div>
        </section>

        <section class="section">
            <div class="section-head"><div><p class="eyebrow">MY REQUESTS</p><h2>我的兑换申请</h2></div></div>
            <p th:if="${#lists.isEmpty(view.myRequests())}" class="lead">还没有提交过兑换申请。</p>
            <div class="panel" th:unless="${#lists.isEmpty(view.myRequests())}" style="padding:0;overflow:hidden;">
                <table class="table" style="border:0;">
                    <thead><tr><th>资源</th><th>积分</th><th>状态</th><th>申请时间</th><th>审核备注</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${view.myRequests()}">
                        <td th:text="${r.itemName()}">资源</td>
                        <td th:text="${r.costPoints()}">0</td>
                        <td>
                            <span class="tag warn" th:if="${r.state() == 'PENDING'}">待审核</span>
                            <span class="tag ok" th:if="${r.state() == 'APPROVED'}">已通过</span>
                            <span class="tag danger" th:if="${r.state() == 'REJECTED'}">已驳回</span>
                            <span class="tag" th:if="${r.state() == 'CANCELLED'}">已取消</span>
                        </td>
                        <td th:text="${r.createdAt()}">时间</td>
                        <td th:text="${r.reviewNote()} ?: '—'">—</td>
                        <td>
                            <form th:if="${r.state() == 'PENDING'}"
                                  th:action="@{/me/redemptions/{id}/cancel(id=${r.id()})}" method="post"
                                  class="inline-form" data-confirm="确定取消这条兑换申请？">
                                <button type="submit" class="link-btn">取消</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="hint" style="margin-top:12px;">驳回或取消不占用积分。</p>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
