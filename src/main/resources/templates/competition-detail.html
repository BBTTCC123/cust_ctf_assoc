<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${competition.name()})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <section class="page-hero">
        <div class="page-hero-inner">
            <div class="page-hero-copy">
                <p class="crumb" style="color:#8fd4ff;margin-bottom:10px;"><a th:href="@{/competitions}" style="color:#8fd4ff;">← 竞赛档案</a></p>
                <p class="eyebrow" th:text="${competition.seasonYear()} + ' SEASON · ' + ${competition.categoryLabel()}">2026 SEASON</p>
                <h1 th:text="${competition.name()}">比赛名称</h1>
                <p class="lead" th:text="${competition.levelLabel()} + ' · ' + ${competition.organizer()} + ' · ' + ${#temporals.format(competition.startDate(),'yyyy-MM-dd')} + ' — ' + ${#temporals.format(competition.endDate(),'yyyy-MM-dd')}">信息</p>
            </div>
            <div class="page-hero-mark" aria-hidden="true"><img th:src="@{/images/logo.webp}" alt=""></div>
        </div>
    </section>
    <div class="container">
        <section class="section" th:if="${!#lists.isEmpty(competition.photoIds())}">
            <div class="section-head">
                <div><p class="eyebrow">GALLERY</p><h2>现场照片</h2></div>
            </div>
            <div class="photo-grid">
                <a th:each="mediaId : ${competition.photoIds()}" th:href="@{/media/{id}(id=${mediaId})}"
                   target="_blank" rel="noopener">
                    <img th:src="@{/media/{id}(id=${mediaId})}" alt="比赛现场照片">
                </a>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <div><p class="eyebrow">RESULT</p><h2>个人奖项</h2></div>
            </div>
            <p th:if="${#lists.isEmpty(competition.individual())}" class="lead">暂无个人奖项。</p>
            <div class="table" th:unless="${#lists.isEmpty(competition.individual())}" style="display:block;overflow-x:auto;">
                <table class="table" style="border:0;">
                    <thead><tr><th>成员</th><th>名次</th><th>积分</th></tr></thead>
                    <tbody>
                    <tr th:each="a : ${competition.individual()}">
                        <td th:text="${a.nickname()}">成员</td>
                        <td><span class="tag" th:text="${a.rankLabel()}">名次</span></td>
                        <td th:text="${a.points()}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <div><p class="eyebrow">TEAM RESULT</p><h2>团队奖项</h2></div>
            </div>
            <p th:if="${#lists.isEmpty(competition.teams())}" class="lead">暂无团队奖项。</p>
            <div class="grid-2">
                <div class="panel team-block" th:each="team : ${competition.teams()}">
                    <p><strong th:text="${team.rankLabel()}">名次</strong>
                        <span class="tag" th:text="'总分 ' + ${team.basePoints()}">分</span></p>
                    <ul>
                        <li th:each="s : ${team.shares()}" th:text="${s.nickname()} + '：' + ${s.points()} + ' 分'">成员</li>
                    </ul>
                </div>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
