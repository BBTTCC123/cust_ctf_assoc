<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${a.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <p><a th:href="@{/announcements}">← 全部公告</a></p>
    <h1 th:text="${a.title}">标题</h1>
    <p class="muted" th:text="${#temporals.format(a.publishedAt,'yyyy-MM-dd HH:mm')}">时间</p>
    <div class="markdown-body" th:utext="${a.contentHtml}">正文</div>

    <section th:if="${!#lists.isEmpty(attachments)}">
        <h2>附件</h2>
        <ul class="article-list">
            <li th:each="f : ${attachments}">
                <a th:href="@{/media/{id}(id=${f.mediaId()})}" target="_blank" rel="noopener"
                   th:text="${f.originalName()}">附件</a>
            </li>
        </ul>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
