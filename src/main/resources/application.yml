server:
  port: 8080
  # 部署在 Nginx 后面：按 X-Forwarded-For / X-Forwarded-Proto 取真实客户端 IP 和协议。
  # 前提是 Nginx 用 $remote_addr 覆盖 X-Forwarded-For（见 docs/部署清单.md），
  # 且 8080 端口不直接对公网开放，否则客户端可以伪造代理头。
  forward-headers-strategy: framework

spring:
  application:
    name: cust-ctf-assoc
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # 业务上限 10MB（MediaService 再校验一次），请求体留出表单开销
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/assoc_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:assoc_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  storage:
    root: ${STORAGE_ROOT:D:/spring_study/uploads}
  points:
    # 补录下限：早于这一天的 occurredOn 一律拒绝，防止把远古数据录进来
    backfill-start: ${POINTS_BACKFILL_START:2015-01-01}
  demo-data:
    # 演示数据只给开发/测试环境；生产保持 false
    enabled: ${DEMO_DATA_ENABLED:false}

logging:
  level:
    root: INFO
    cn.edu.cust.assoc: DEBUG
    org.flywaydb: INFO
