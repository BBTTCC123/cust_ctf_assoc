server:
  port: 8080

spring:
  application:
    name: cust-ctf-assoc
  thymeleaf:
    cache: false
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/assoc_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:assoc_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  storage:
    root: ${STORAGE_ROOT:D:/spring_study/uploads}

logging:
  level:
    root: INFO
    cn.edu.cust.assoc: DEBUG
    org.flywaydb: INFO