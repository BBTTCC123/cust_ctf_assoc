server:
  # 默认只监听回环地址，公网流量必须经过同机 Nginx。
  # 如果 Nginx 与应用不在同一台机器，必须显式覆盖并用防火墙限制来源。
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  # 只信任本机 Nginx 注入的转发头；不可信来源直接连接时忽略 X-Forwarded-*。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: '127.0.0.0/8,::1/128'

spring:
  application:
    name: cust-ctf-assoc
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # 业务上限 10MB（MediaService 再校验一次），请求体留出表单开销
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/assoc_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:assoc_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        # 发布脚本只需要 health；不要改成通配符，否则会扩大管理端点暴露面。
        include: health
  endpoint:
    health:
      show-details: never

app:
  storage:
    root: ${STORAGE_ROOT:D:/spring_study/uploads}
  points:
    # 补录下限：早于这一天的 occurredOn 一律拒绝，防止把远古数据录进来
    backfill-start: ${POINTS_BACKFILL_START:2015-01-01}
  demo-data:
    # 演示数据只给开发/测试环境；生产保持 false
    enabled: ${DEMO_DATA_ENABLED:false}

logging:
  level:
    root: INFO
    cn.edu.cust.assoc: DEBUG
    org.flywaydb: INFO
